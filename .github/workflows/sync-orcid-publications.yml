name: Sync Publications from ORCID

on:
  # Pulsar Lab : déclenchement manuel seulement (onglet Actions de GitHub,
  # bouton « Run workflow »). Le résultat arrive sous forme de demande de
  # fusion (pull request) à relire avant de l'accepter.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-orcid-publications
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Import the public ORCID record
        env:
          ORCID_ID: "0000-0003-1000-1042" # Nicola Thibault
        run: |
          if [ -z "$ORCID_ID" ]; then
            echo "::error::Identifiant ORCID [À COMPLÉTER] dans .github/workflows/sync-orcid-publications.yml"
            exit 1
          fi
          python -m pip install "hugobloxorcid==0.3.0"
          # Import direct dans content/en/publications : l'outil reconnaît ainsi
          # les publications déjà présentes par leur DOI ou leur identifiant
          # ORCID, même quand leur dossier a été renommé.
          hugoblox-orcid-import "$ORCID_ID" \
            --output content/en/publications \
            --projects-output "$RUNNER_TEMP/orcid-projects" \
            --no-download-pdf \
            --no-import-grants

      - name: Add only newly discovered publications
        run: |
          python scripts/normalize_orcid_publications.py content/en/publications
          rsync -a --ignore-existing content/en/publications/ content/fr/publications/

      - name: Open a reviewable update
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/orcid-publications
          delete-branch: true
          commit-message: "content: add publications discovered through ORCID"
          title: "Publications: review new ORCID records"
          body: |
            This automated update adds publications newly discovered in the configured public ORCID record.

            Please review titles, dates, authors, publication status, and links before merging. Existing publication files are never overwritten.
          labels: automated-pr, content, publications
