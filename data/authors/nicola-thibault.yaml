role: Assistant Professor, Department of Health Sciences, and Director of Pulsar Lab
bio: >-
  Nicola Thibault is a neuropsychologist specializing in cognitive neuroscience.
  He holds a doctorate in psychology (research and intervention) from Université
  Laval. His dissertation focused on time perception and used
  electroencephalography to show that the brain processes short and long time
  intervals differently depending on the sensory modality involved. His research
  interests include executive functions, attention, working memory, time
  perception, and brain oscillations. His current work examines the mechanisms
  underlying these cognitive processes in neuropsychological tasks. Before joining
  UQAR, he completed a postdoctoral fellowship at the Centre de recherche CERVO,
  within the Canada Excellence Research Chair in Neuroplasticity.
