role: Professeur adjoint au Département des sciences de la santé et directeur du laboratoire Pulsar
bio: >-
  Le professeur Nicola Thibault est un neuropsychologue spécialisé en
  neurosciences cognitives. Titulaire d’un doctorat en psychologie (recherche et
  intervention) de l’Université Laval, il a consacré sa thèse à la perception du
  temps et a démontré, par l’électroencéphalographie, que le cerveau traite
  différemment les intervalles temporels courts et longs, selon la modalité
  sensorielle sollicitée. Dans ses recherches, il s’intéresse aux fonctions
  exécutives, à l’attention, à la mémoire de travail, à la perception du temps et
  aux oscillations cérébrales. Ses travaux actuels portent sur les mécanismes qui
  sous-tendent ces composantes cognitives au sein de tâches neuropsychologiques.
  Avant de se joindre à l’UQAR, le professeur Thibault a effectué un stage
  postdoctoral au Centre de recherche CERVO, au sein de la Chaire d’excellence en
  recherche du Canada sur la neuroplasticité.
